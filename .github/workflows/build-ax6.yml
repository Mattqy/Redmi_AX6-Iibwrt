name: 红米AX6 NSS固件编译

on:
  workflow_dispatch:
    inputs:
      release:
        description: '编译完成后发布到 Release'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  REPO_URL: https://github.com/LiBwrt/LibWrt
  REPO_BRANCH: 25.12-nss
  CONFIG_FILE: .config
  DIY_SH: diy.sh
  TZ: Asia/Shanghai
  RELEASE_DIR: ''
  GIT_TERMINAL_PROMPT: 0

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet \
            /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache cmake cpio curl device-tree-compiler \
            fastjar flex gawk gettext gcc-multilib g++-multilib git gperf \
            haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses-dev libncursesw5-dev libpython3-dev libreadline-dev \
            libssl-dev libtool lrzsz genisoimage msmtp nano ninja-build p7zip \
            p7zip-full patch pkgconf python3 python3-pip python3-pyelftools \
            python3-setuptools qemu-utils rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs upx-ucl unzip vim wget \
            xmlto xxd zlib1g-dev || true
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir && sudo chown $USER:$GROUPS /workdir

      - name: 克隆 LibWrt 源码
        working-directory: /workdir
        run: |
          git clone -b v25.12.2 --single-branch https://github.com/LiBwrt/LibWrt.git openwrt
          rm -rf $GITHUB_WORKSPACE/openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: 执行 DIY 脚本
        run: |
          chmod +x $DIY_SH 2>/dev/null || true
          [ -f $DIY_SH ] && cp $DIY_SH openwrt/ && cd openwrt && ./$DIY_SH

      - name: 更新并安装 feeds
        env:
          GIT_TERMINAL_PROMPT: 0
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install luci-i18n-base-zh-cn 2>/dev/null || true

      - name: 加载自定义配置
        run: |
          [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
          cd openwrt && make defconfig

      - name: 下载编译依赖
        run: |
          cd openwrt
          make download -j$(nproc)
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译固件
        id: compile
        run: |
          cd openwrt
          echo "▶ 多线程编译中..."
          make -j$(nproc)
          if [ $? -ne 0 ]; then
            echo "▶ 多线程编译失败，自动切入单线程打印详细日志..."
            make -j1 V=s
          fi
          echo "status=success" >> $GITHUB_OUTPUT
          echo "FILE_DATE=$(date +"%Y%m%d_%H%M")" >> $GITHUB_ENV

      - name: 查找并整理固件文件
        id: organize
        if: steps.compile.outputs.status == 'success'
        run: |
          BIN_PATH=$(find openwrt/bin/targets -name "*sysupgrade*" | head -1 | xargs dirname 2>/dev/null || echo "")
          [ -z "$BIN_PATH" ] && BIN_PATH=$(find openwrt/bin/targets -type d | tail -1)
          
          # 创建存放独立 Release 文件的目录
          RELEASE_DIR="$GITHUB_WORKSPACE/release_files"
          mkdir -p $RELEASE_DIR
          
          # 仅提取散装固件包与配置文件
          cp -f $BIN_PATH/*sysupgrade* $RELEASE_DIR/ 2>/dev/null || true
          cp -f $BIN_PATH/*factory* $RELEASE_DIR/ 2>/dev/null || true
          cp -f $BIN_PATH/*initramfs* $RELEASE_DIR/ 2>/dev/null || true
          cp -f $BIN_PATH/*.buildinfo $RELEASE_DIR/ 2>/dev/null || true
          cp -f $BIN_PATH/sha256sums $RELEASE_DIR/ 2>/dev/null || true
          [ -f openwrt/.config ] && cp -f openwrt/.config $RELEASE_DIR/Config_AX6.txt
          
          # 设置环境变量供后续 Step 使用
          echo "RELEASE_DIR=$RELEASE_DIR" >> $GITHUB_ENV
          echo "BIN_DIR=$BIN_PATH" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 上传 Artifacts
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success'
        with:
          name: AX6-NSS-stock-firmware
          path: ${{ steps.organize.outputs.BIN_DIR }}/
          retention-days: 7

      - name: 生成 Release 标签
        id: tag
        if: steps.organize.outputs.status == 'success'
        run: |
          echo "release_tag=AX6-NSS-stock-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.status == 'success'
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: 红米AX6 LibWrt-NSS固件 ${{ steps.tag.outputs.release_tag }}
          files: ${{ env.RELEASE_DIR }}/*.*
          body: |
            | 项目 | 内容 |
            |---|---|
            | 源码仓库 | LiBwrt/LibWrt |
            | 固件版本 | v25.12.2 |
            | 核心芯片 | Qualcomm IPQ8071A |
            | 设备型号 | Redmi AX6 (stock 大分区) |
            | NSS 驱动 | 集成 IPQ807x NSS 硬件加速驱动 |
            | 默认 IP | 10.0.0.1 |
